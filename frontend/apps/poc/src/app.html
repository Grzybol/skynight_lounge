<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<!-- Local SkyJump fonts only — no Typekit / Google Fonts runtime. -->
		<link rel="stylesheet" href="%sveltekit.assets%/assets/fonts/skyjump/skyjump-fonts.css" />
		<style>
			html,
			body {
				font-family: var(--skyjump-font-ui, system-ui, sans-serif);
				margin: 0;
				height: 100%;
				overflow: hidden;
				/* No double-tap zoom or pinch on touch devices. */
				touch-action: manipulation;
			}
		</style>
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
		/>
		%sveltekit.head%
	</head>
	<body style="margin: 0; padding: 0; overflow: hidden; background-color: black">
		<div>%sveltekit.body%</div>
	</body>
</html>
